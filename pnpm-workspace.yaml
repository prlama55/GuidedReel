packages:
  - apps/*
  - packages/*

catalog:
  # React
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0

  # Remotion (all packages MUST share one version)
  remotion: 4.0.533
  '@remotion/player': 4.0.533
  '@remotion/renderer': 4.0.533
  '@remotion/bundler': 4.0.533
  '@remotion/cli': 4.0.533
  '@remotion/transitions': 4.0.533
  '@remotion/fonts': 4.0.533
  '@remotion/media-utils': 4.0.533
  '@remotion/gif': 4.0.533

  # Core libs
  zod: ^4.6.5
  zustand: ^5.0.15
  zundo: ^2.3.0
  immer: ^11.1.21
  idb: ^8.0.4
  nanoid: ^5.1.5
  papaparse: ^5.5.3
  '@types/papaparse': ^5.3.16

  # UI
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2
  react-resizable-panels: ^4.14.2
  lucide-react: ^1.52.0
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  clsx: ^2.1.1

  # Apps
  next: 16.4.0
  electron: 44.6.0
  electron-builder: ^26.15.3
  electron-vite: ^5.0.0
  vite: ^7.3.7
  '@vitejs/plugin-react': ^5.2.0

  # Tooling
  typescript: 5.9.3
  turbo: ^2.11.7
  vitest: ^5.0.3
  '@vitest/coverage-v8': ^5.0.3
  jsdom: ^28.0.0
  '@testing-library/react': ^16.3.0
  '@testing-library/jest-dom': ^6.9.0
  '@playwright/test': ^1.63.0
  eslint: ^10.12.0
  '@eslint/js': ^10.0.0
  typescript-eslint: ^8.56.0
  eslint-plugin-react-hooks: ^7.0.0
  eslint-config-prettier: ^10.1.0
  prettier: ^3.9.9
  '@types/node': ^22.19.0
  rimraf: ^6.0.1
  tsx: ^4.20.0

# pnpm 10 blocks lifecycle scripts unless listed. These need their postinstall.
onlyBuiltDependencies:
  - electron
  - esbuild
  - '@remotion/compositor-darwin-arm64'
  - '@remotion/compositor-darwin-x64'
  - '@remotion/compositor-linux-x64-gnu'
  - '@remotion/compositor-linux-arm64-gnu'
  - '@remotion/compositor-win32-x64-msvc'
  - electron-winstaller
  - '@parcel/watcher'
  - sharp
