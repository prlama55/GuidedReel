appId: com.guidedreel.app
productName: GuidedReel
copyright: Copyright © 2026 Padma Raj Lama
# Predictable release file names, matched by scripts/install.sh and scripts/install.ps1:
#   GuidedReel-0.1.0-mac-arm64.dmg, GuidedReel-0.1.0-win-x64.exe, GuidedReel-0.1.0-linux-x86_64.AppImage, ...
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/remotion-bundle
    to: remotion-bundle
# Remotion's renderer and compositor binaries must run from disk, not from the asar archive.
asarUnpack:
  - '**/node_modules/@remotion/**'
  - '**/node_modules/esbuild/**'
npmRebuild: false
# Release metadata for GitHub Releases and future auto-updates. CI passes --publish never,
# so nothing is uploaded by electron-builder itself; the release workflow attaches artifacts.
publish:
  provider: github
  owner: prlama55
  repo: GuidedReel

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing/notarization are driven by env vars (CSC_LINK, APPLE_ID, ...) in CI only.
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: GuidedReel uses the microphone to record voiceovers for your videos.
dmg:
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

linux:
  category: Video
  target:
    - AppImage
    - deb
  maintainer: Padma Raj Lama
